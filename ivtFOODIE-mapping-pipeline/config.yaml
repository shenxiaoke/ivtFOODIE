# Pipeline configuration

# Basic settings
species: mouse           # Species: human, mouse, fly
n_parts: 32             # Number of FASTQ splits
base_dir: "/dshare/xielab/analysisdata/TFC/shenk/rawdata/20260121_SK_plasmid_deaminase/ivtFOODIE_map"          # Output root (absolute path)
raw_data_source: "/dshare/xielab/analysisdata/TFC/shenk/rawdata/20260121_SK_plasmid_deaminase/ivtFOODIE_map/data"  # Directory of downloaded fastq.gz files

# Tool and script paths
paths:
  scripts: "/share/home/shenk/analysis/pipeline-example/scripts"
  bismark_env: "/share/home/shenk/local/anaconda3/envs/bismark/bin"
  methyl_extract: "/dshare/home/zhangz/Devel/foodie-routine/methyl_extract_XCX-test.new.py"
  sort_tmp: "/dshare/xielab/analysisdata/TFC/shenk/sort.tmp"
  ucsc_tools: "/share/home/shenk/local/UCSC_tools"
  sample_rename_script: "/share/home/shenk/analysis/pipeline-example/pipeline-big-efficient_wo_st_ed-deduplication_codeRefactoring/Sample_rename.new.sh"  # Absolute path to sample rename script

# Reference genomes for Bismark
genomes:
  human: /gshare/xielab/jianfc/genome/GRCh38
  mouse: /share/home/baiyl/basic/database/mouse/mm10/Index/Bismark_mm10
  fly: /gshare/xielab/jianfc/genome/Drosophila_dm6
  lambda: /gshare/xielab/jianfc/genome/lambda_DNA

# Chromosome sizes (for coverage, peaks, etc.)
chromsizes:
  human: /gshare/xielab/jianfc/reference/human/hg38.chrom.sizes
  mouse: /gshare/xielab/jianfc/reference/mouse/mm10.chrom.sizes
  fly: /gshare/xielab/jianfc/genome/Drosophila_dm6/dm6.chrom.sizes

# MACS2 effective genome size
gsize:
  human: hs
  mouse: mm
  fly: dm

# IGV genome build for igvtools toTDF
igv_genome:
  human: hg38
  mouse: mm10
  fly: dm6

# Bismark alignment options
bismark:
  insert_size: 2000      # -X: e.g. 2000 in vivo, 500 in vitro (also can use 2000)
  quality: 5           # Quality threshold
  trim_threshold: 0    # -t: e.g. 15 in vivo, 0 in vitro
  save_unmapped: false    # Keep unmapped reads in a separate folder

# Trim Galore
trim_galore:
  quality: 20
  stringency: 2
  error_rate: 0.1

# Cutadapt (FOODIE adapter trimming)
cutadapt:
  cut_r1_left: 36      # --cut 5': e.g. 0 in vivo, 36 in vitro
  cut_r1_right: 46     # --cut 3': e.g. 0 in vivo, 46 in vitro
  cut_r2_left: 46      # R2 --cut 5': e.g. 0 in vivo, 46 in vitro
  cut_r2_right: 36     # R2 --cut 3': e.g. 0 in vivo, 36 in vitro

# Per-rule cluster resources (can be overridden by cluster.yaml)
resources:
  setup_rawdata:
    threads: 1
    mem_gb: 2
    time: "1:00:00"
    partition: "compute_plus"
  
  split_fastq:
    threads: 1
    mem_gb: 20
    time: "7-00:00:00"
    partition: "compute_plus"
  
  process_part:
    threads: 4
    mem_gb: 20
    time: "7-00:00:00"
    partition: "compute_plus"
  
  merge_and_analysis:
    threads: 16
    mem_gb: 64
    time: "7-00:00:00"
    partition: "compute_fat"
  
  plot_conversion:
    threads: 1
    mem_gb: 4
    time: "1:00:00"
    partition: "compute_plus"
